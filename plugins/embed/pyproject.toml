[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "beets-embed"
version = "0.1.0"
description = "Offline music embeddings and retrieval for beets"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
dependencies = ["beets", "numpy", "Pillow"]

[tool.setuptools.packages.find]
include = ["beetsplug.embed*", "beets_embed*"]
namespaces = true

[tool.setuptools.package-data]
"beets_embed" = ["models.json"]
